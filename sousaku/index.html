<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Shippori+Mincho:wght@500;700&amp;family=Zen+Kaku+Gothic+New:wght@400;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sousaku/sousaku.css">
<script src="/sousaku/works.js" defer></script>
<script src="/sousaku/sousaku.js" defer></script>
<script src="/assets/ga.js" defer></script>
<meta name="theme-color" content="#151413">
<title>創作ブース | GiveTex</title>
<meta name="description" content="GiveTex の創作ブース。イベントで頒布するマンガや小説を、ここで読めます。">
</head>
<body>
<header class="sk-bar">
  <div class="sk-bar-in">
    <a class="sk-brand" href="/sousaku/"><b>創作ブース</b><span>GIVETEX CREATIVE</span></a>
    <nav aria-label="メニュー"><a href="#works">作品</a><a href="#events">出展</a><a href="/">GiveTex</a></nav>
  </div>
</header>
<main>
  <section class="sk-hero">
    <div class="sk-hero-in">
      <p class="sk-kicker">MANGA ・ NOVEL</p>
      <h1>描いて、<br>書いて、<br><em>頒布</em>する。</h1>
      <p>コミケなどのイベントで頒布するマンガや小説を、ここでも読めるようにしています。会場で QR コードを読み込めば、その場で読めます。</p>
    </div>
    <div class="sk-burst" aria-hidden="true">会場で<br>読める！</div>
  </section>
  <div class="sk-wrap">
    <section class="sk-sec" id="events" aria-labelledby="h-ev">
      <div class="sk-sec-hd"><h2 id="h-ev">出展予定</h2><small>EVENTS</small></div>
      <div id="sk-events"></div>
    </section>
    <section class="sk-sec" id="works" aria-labelledby="h-wk">
      <div class="sk-sec-hd"><h2 id="h-wk">作品</h2><small>WORKS</small></div>
      <div class="sk-filter" role="group" aria-label="種類でしぼりこむ"><button type="button" data-type="" aria-pressed="true">すべて</button><button type="button" data-type="manga" aria-pressed="false">マンガ</button><button type="button" data-type="novel" aria-pressed="false">小説</button></div>
      <div class="sk-grid" id="sk-grid"><noscript><div class="sk-empty">作品の一覧の表示には JavaScript を有効にしてください。</div></noscript></div>
    </section>
  </div>
</main>
<footer class="sk-foot"><div class="sk-foot-in"><a href="/">GiveTex ホーム</a><a href="/privacy.html">プライバシーポリシー</a><span>&copy; 2026 GiveTex</span></div></footer>
</body>
</html>
